name: Copilot Weekly - Official Source Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect official source headings without publishing
        run: python3 scripts/collect_official_sources.py
      - name: Verify published site is untouched
        run: git diff --exit-code -- index.html
      - name: Save source audit as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-official-source-audit
          path: source-audit.json
          retention-days: 7
